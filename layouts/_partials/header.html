<header class="header">
    <nav class="header-nav">
        <div class="logo">
            <a href="{{ "" | absLangURL }}" accesskey="h" title="{{ site.Title }} (Alt + H)">{{ site.Title }}</a>
        </div>
        <ul id="menu" class="menu">
            {{- $current := .Permalink }}
            {{- range site.Menus.main }}
            {{- $url := .URL | absLangURL }}
            {{- $active := or (eq $current $url) (and (ne .URL "/") (hasPrefix $current $url)) }}
            <li>
                <a href="{{ $url }}" title="{{ .Name }}">
                    <span{{ if $active }} class="active"{{ end }}>{{ .Name }}</span>
                </a>
            </li>
            {{- end }}
        </ul>
        {{- if not site.Params.disableThemeToggle }}
        <button id="theme-toggle" class="theme-toggle" accesskey="t" title="切换主题 (Alt + T)" aria-label="切换主题">
            <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
        {{- end }}
    </nav>
</header>
