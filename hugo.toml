baseURL = 'https://FlamingoCheers.github.io/'
defaultContentLanguage = 'zh-cn'
locale = 'zh-CN'
title = '两只火烈鸟'
theme = 'PaperMod'

# 启用 CJK 语言支持，正确统计中文字数
hasCJKLanguage = true

# 启用相对链接
relativeURLs = true
canonifyURLs = true

# 分页设置
paginate = 10

# 永久链接格式
[permalinks]
  writing = '/writing/:slug/'

# 菜单设置
[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1

[[menu.main]]
  identifier = "research"
  name = "研究"
  url = "/research/"
  weight = 2

[[menu.main]]
  identifier = "writing"
  name = "文章"
  url = "/writing/"
  weight = 3

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 4

# PaperMod 主题参数
[params]
  env = "production"
  mainSections = ["writing"]
  description = "两只火烈鸟 · 思考、AI、阅读与旅行"
  author = "夏渡云"
  siteNameEn = "Flamingo · Cheers"

  # 文章页信息由自定义模板输出
  ShowReadingTime = false
  ShowShareButtons = false
  ShowToc = false
  TocOpen = false
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  ShowBackToTop = true
  ShowPostNavLinks = false

  # 时区
  timezone = "Asia/Shanghai"

[params.footer]
  hideCopyright = true
  text = "[归档](/archives/) · [标签](/tags/) · [搜索](/search/) · [RSS](/index.xml) · [GitHub](https://github.com/FlamingoCheers)"

# 搜索配置
[params.fuse]
  location = 1
  threshold = 0.3
  ignoreFieldnorm = false

[outputs]
  home = ["HTML", "RSS", "JSON"]

# 分类和标签
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

